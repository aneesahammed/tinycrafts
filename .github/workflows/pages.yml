name: Deploy TinyCrafts Pages

on:
  push:
    branches:
      - pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            dataduck/package-lock.json
            SeeQLite/package-lock.json

      - name: Install DataDuck dependencies
        run: npm ci
        working-directory: dataduck

      - name: Install SeeQLite dependencies
        run: npm ci
        working-directory: SeeQLite

      - name: Build Pages artifact
        run: node scripts/build-pages.mjs

      - name: Verify Pages artifact
        run: node scripts/verify-pages-build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
