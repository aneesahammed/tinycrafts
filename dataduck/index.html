<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: https://api.anthropic.com https://api.groq.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types dataduck-html; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e0f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="DataDuck is a local-first data viewer PWA powered by DuckDB-WASM. Open, inspect, query, and join local Parquet and CSV files without uploads."
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>DataDuck</title>
    <link rel="stylesheet" href="./styles.css?v=26" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="head" id="head"></header>
      <div class="stage" id="stage">
        <aside class="rail" id="rail"></aside>
        <div class="rail-resizer-track">
          <div class="rail-resizer" id="railResizer" role="separator" aria-orientation="vertical" aria-label="Resize file rail" tabindex="0"></div>
        </div>
        <main class="work" id="work"></main>
        <div class="right-resizer-track">
          <div class="right-resizer" id="rightResizer" role="separator" aria-orientation="vertical" aria-label="Resize right panel" tabindex="0"></div>
        </div>
      </div>
    </div>
    <div class="palette-scrim" id="paletteScrim" hidden>
      <div class="palette" id="palette"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input id="fileInput" class="sr-only" type="file" accept=".parquet,.parq,.csv" multiple />
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
