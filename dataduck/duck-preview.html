<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TinyCrafts duck mark preview</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; }
  .pane { padding: 32px; }
  .pane.light { background: #f4f0ea; color: #111; }
  .pane.dark  { background: #141414; color: #f5f5f5; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin: 0 0 18px; font-weight: 600; }
  .row { display: flex; align-items: flex-end; gap: 28px; padding: 22px; border-radius: 12px; }
  .pane.light .row { background: #fff; box-shadow: 0 1px 2px #0001; }
  .pane.dark  .row { background: #1d1d1d; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .label { font-size: 11px; opacity: .55; letter-spacing: .04em; }
  svg { display: block; }
</style>
</head>
<body>

<template id="mark">
  <svg viewBox="0 0 823 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TinyCrafts duck mark">
    <g fill="currentColor">
      <path d="M406 312 C407 276.1 377.6 294.1 368 297 C358.4 299.9 338.9 329.2 329 335 C319.1 340.8 300.8 346.4 289 343 C277.2 339.6 245.4 312.2 235 308 C224.6 303.8 211.9 306.6 206 309 C200.1 311.4 192 317.1 188 327 C184 336.9 180 377.5 174 388 C168 398.5 151.5 408 140 411 C128.5 414 91 407.1 82 412 C73 416.9 42.4 425 68 450 C93.6 475 254 591.4 287 612 C320 632.6 322.9 618.5 332 615 C341.1 611.5 350.8 621.9 360 584 C369.2 546.1 405 347.9 406 312 Z"/>
      <path d="M606 112 C599.5 110.5 585.5 110.5 575 116 C564.5 121.5 532.6 151.5 522 156 C511.4 160.5 500 156.9 490 152 C480 147.1 452.2 118.8 442 117 C431.8 115.2 402.9 102.4 408 138 C413.1 173.6 469.6 365.5 483 402 C496.4 438.5 505.2 427.8 515 430 C524.8 432.2 530.5 444 561 420 C591.5 396 736.6 265.4 759 238 C781.4 210.6 749.1 204.9 740 201 C730.9 197.1 697 208.1 686 207 C675 205.9 659.4 201.9 652 192 C644.6 182.1 632.8 138 627 128 C621.2 118 612.5 113.5 606 112 Z"/>
    </g>
  </svg>
</template>

<section class="pane light">
  <h2>Light</h2>
  <div class="row" id="rowLight"></div>
</section>
<section class="pane dark">
  <h2>Dark</h2>
  <div class="row" id="rowDark"></div>
</section>

<script>
  const tpl = document.getElementById('mark').content.querySelector('svg');
  const sizes = [16, 24, 32, 48, 96, 200];
  function build(target) {
    sizes.forEach(s => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const svg = tpl.cloneNode(true);
      const w = svg.viewBox.baseVal.width;
      const h = svg.viewBox.baseVal.height;
      svg.setAttribute('width', s);
      svg.setAttribute('height', Math.round(s * (h / w)));
      cell.appendChild(svg);
      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = s + ' px';
      cell.appendChild(lab);
      target.appendChild(cell);
    });
  }
  build(document.getElementById('rowLight'));
  build(document.getElementById('rowDark'));
</script>

</body>
</html>
