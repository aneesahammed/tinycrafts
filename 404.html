<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" />
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
    <title>Page not found - TinyCrafts</title>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          root.setAttribute(
            "data-theme",
            localStorage.getItem("tinycrafts-theme") ||
              (matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"),
          );
        } catch (_) {
          root.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      :root {
        color-scheme: light;
        --paper: #f7f3ec;
        --ink: #191612;
        --ink-2: #5d564c;
        --ink-3: #918779;
        --accent: #3867e8;
        --accent-deep: #244cc6;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        --sans:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #171816;
        --ink: #f3eee5;
        --ink-2: #c9c0b3;
        --ink-3: #8d8579;
        --accent: #86a2ff;
        --accent-deep: #b5c4ff;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 22px;
        background:
          linear-gradient(rgba(25, 22, 18, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(25, 22, 18, 0.018) 1px, transparent 1px),
          var(--paper);
        background-size: 36px 36px;
        color: var(--ink);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 460px);
      }

      .brand-mark {
        display: block;
        width: 40px;
        height: 40px;
        margin-bottom: 28px;
        color: var(--accent);
      }

      h1 {
        font-family: var(--sans);
        font-size: 44px;
        font-weight: 360;
        line-height: 1.05;
      }

      p {
        margin-top: 16px;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 26px;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 4px;
        color: var(--ink);
        font-size: 13px;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--accent-deep);
        color: var(--accent-deep);
        outline: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="brand-mark"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 4 18.9 8 12 12 5.1 8Z" fill="currentColor" />
        <path d="M12 12 18.9 8V16L12 20Z" fill="currentColor" fill-opacity=".35" />
        <path d="M5.1 8V16L12 20" />
      </svg>
      <h1>Nothing here.</h1>
      <p>This page doesn't exist, or it moved. The tools are all listed on the home page.</p>
      <a href="/">&larr; tinycrafts.ai</a>
    </main>
  </body>
</html>
